name: CI

on:
  push:
    tags:
      - '*-python'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ffmpeg: [ffmpeg6, ffmpeg7]
    steps:
      - uses: actions/checkout@v4
      - name: Bake variant into sources
        run: |
          sed -i 's/^version = "\([^"]*\)"$/version = "\1+${{ matrix.ffmpeg }}"/' ez-video-capture-python/Cargo.toml
          sed -i 's/^default = \["ffmpeg[67]"\]$/default = ["${{ matrix.ffmpeg }}"]/' ez-video-capture-core/Cargo.toml
          sed -i 's/^default = \["ffmpeg[67]"\]$/default = ["${{ matrix.ffmpeg }}"]/' ez-video-capture-python/Cargo.toml
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ez-video-capture-python
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist-${{ matrix.ffmpeg }}
          path: ez-video-capture-python/dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-python')) || github.event_name == 'workflow_dispatch' }}
    needs: [sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wheels-*/*
